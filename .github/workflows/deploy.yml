name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if CI workflow passed
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Wait for deployment to be ready
        run: |
          echo "Deployment URL: ${{ steps.deploy.outputs.url }}"
          echo "Waiting 30 seconds for deployment to be ready..."
          sleep 30

      - name: Seed production database
        run: |
          echo "Seeding production database..."
          response=$(curl -s -w "%{http_code}" -o /tmp/seed_response.txt \
            -X POST https://teamboard.workermill.com/api/seed \
            -H "Authorization: Bearer ${{ secrets.SEED_TOKEN }}" \
            -H "Content-Type: application/json")

          http_code="${response: -3}"
          echo "HTTP Status: $http_code"

          if [ "$http_code" = "200" ]; then
            echo "✅ Database seeded successfully"
          elif [ "$http_code" = "409" ]; then
            echo "✅ Database already seeded (409 Conflict - expected for idempotent operation)"
          else
            echo "❌ Seeding failed with status $http_code"
            cat /tmp/seed_response.txt
            exit 1
          fi

      - name: Verify seed data
        run: |
          echo "Verifying production seed data..."
          ./scripts/verify-seed.sh
        env:
          # Use production database URL for verification
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          EXPECTED_CARDS: 30

      - name: Run smoke tests
        run: |
          echo "Running production smoke tests..."
          ./scripts/smoke-test.sh
        env:
          BASE_URL: https://teamboard.workermill.com

      - name: Deployment Summary
        run: |
          echo "🚀 Deployment completed successfully!"
          echo "📍 Live URL: https://teamboard.workermill.com"
          echo "🔗 Deployment URL: ${{ steps.deploy.outputs.url }}"
          echo "✅ Database seeded and verified"
          echo "✅ Smoke tests passed"