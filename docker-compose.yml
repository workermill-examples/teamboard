version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: teamboard-postgres
    environment:
      POSTGRES_USER: teamboard
      POSTGRES_PASSWORD: teamboard
      POSTGRES_DB: teamboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: